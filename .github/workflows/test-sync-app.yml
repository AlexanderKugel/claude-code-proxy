name: Test sync App

on:
  workflow_dispatch:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Generate App token
        id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CCP_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.CCP_SYNC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: claude-code-proxy
          permission-contents: read

      - name: Verify repository access
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: gh api installation/repositories --jq '.repositories[].full_name'
